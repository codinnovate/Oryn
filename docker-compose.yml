services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oryn
      POSTGRES_PASSWORD: oryn
      POSTGRES_DB: oryn
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oryn"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

volumes:
  pgdata:
